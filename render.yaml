services:
  - type: web
    name: vayusaathi-smog-copilot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: AQI_IN_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
